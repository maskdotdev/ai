[project]
name = "skills-eval"
version = "0.1.0"
description = "Local, robust evaluation harness for comparing skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "typer>=0.12.5",
  "rich>=13.9.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
]

[project.scripts]
skills-eval = "skills_eval.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.uv]
default-groups = ["dev"]
